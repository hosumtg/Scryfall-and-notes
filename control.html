<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Overlay Control Panel</title>
<style>
  body {
    margin: 0;
    background: #14161c;
    color: #fff;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 80px;
  }
  h1 { font-size: 20px; color: #f4c04a; margin-bottom: 4px; }
  h2 { font-size: 15px; color: #f4c04a; margin: 0 0 10px; }
  #status { font-size: 13px; color: #999; margin-bottom: 24px; }
  #preview {
    background: #1e2028;
    border: 2px solid #f4c04a;
    border-radius: 12px;
    padding: 16px 24px;
    font-size: 18px;
    margin-bottom: 24px;
    min-width: 280px;
    text-align: center;
  }
  #preview .label { color: #999; font-size: 12px; display: block; margin-bottom: 4px; }
  .row { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; justify-content: center; }
  button {
    background: #2a2d38;
    color: #fff;
    border: 2px solid #f4c04a;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 15px;
    cursor: pointer;
  }
  button:hover { background: #3a3d4a; }
  button.mode.active { background: #f4c04a; color: #1a1300; }
  button.big { font-size: 20px; padding: 18px 30px; }
  button.danger { border-color: #ff5a5a; }
  button.small { padding: 6px 10px; font-size: 13px; }

  .panel {
    background: #1a1c24;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 18px 20px;
    width: 420px;
    max-width: 90vw;
    margin-top: 30px;
  }
  .panel input, .panel textarea {
    width: 100%;
    box-sizing: border-box;
    background: #0f1015;
    color: #fff;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    margin-bottom: 8px;
    font-family: inherit;
  }
  .listItem {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #22242e;
    border-radius: 8px;
    padding: 8px 12px;
    margin-bottom: 6px;
    font-size: 14px;
  }
  .listItem span { flex: 1; margin-right: 8px; }
  .listItem.current { border: 1px solid #f4c04a; }
  .listItem[draggable="true"] { cursor: grab; }
  .listItem.dragging { opacity: 0.4; }
  .listItem .dragHandle { color: #666; margin-right: 8px; cursor: grab; user-select: none; }
</style>
</head>
<body>

<h1>Podcast Overlay Control</h1>
<div id="status">connecting...</div>

<div id="preview">
  <span class="label">Now showing</span>
  <span id="previewText">—</span>
</div>

<div class="row">
  <button id="btnCards" class="mode">Cards</button>
  <button id="btnSlides" class="mode">Slides</button>
  <button id="btnImages" class="mode">Images</button>
</div>

<div class="row">
  <button id="btnPrev" class="big">&larr; Prev</button>
  <button id="btnNext" class="big">Next &rarr;</button>
</div>

<div class="row">
  <button id="btnHide" class="danger">Hide overlay</button>
</div>

<!-- ===== Card list editor ===== -->
<div class="panel">
  <h2>Cards</h2>
  <input id="newCardInput" type="text" placeholder="Card name, e.g. Sol Ring">
  <button id="addCardBtn" class="small">Add card</button>
  <div id="cardListUI" style="margin-top:10px;"></div>
</div>

<!-- ===== Custom image uploader ===== -->
<div class="panel">
  <h2>Images</h2>
  <input id="newImageInput" type="file" accept="image/png, image/jpeg">
  <input id="newImageLabel" type="text" placeholder="Label (optional), e.g. Deck list">
  <button id="addImageBtn" class="small">Add image</button>
  <div id="imageUploadStatus" style="font-size:12px; color:#999; margin-bottom:6px;"></div>
  <div id="imageListUI"></div>
</div>

<!-- ===== Slides editor ===== -->
<div class="panel">
  <h2>Slides (bullet points)</h2>
  <input id="newSlideHeaderInput" type="text" placeholder="Header (optional), e.g. Host 1">
  <textarea id="newSlideInput" rows="4" placeholder="One bullet per line, e.g.&#10;Playing since 2015&#10;Prefers aggro decks"></textarea>
  <button id="addSlideBtn" class="small">Add slide</button>
  <div id="slideListUI" style="margin-top:10px;"></div>
</div>

<!-- ===== Slide text style ===== -->
<div class="panel">
  <h2>Slide Text Style</h2>
  <label style="font-size:13px; color:#999; display:block; margin-bottom:4px;">Text color</label>
  <input id="styleTextColor" type="color" value="#ffffff" style="width:100%; height:36px; margin-bottom:10px;">
  <label style="font-size:13px; color:#999; display:block; margin-bottom:4px;">Accent color (header + bullet dots)</label>
  <input id="styleAccentColor" type="color" value="#f4c04a" style="width:100%; height:36px; margin-bottom:10px;">
  <label style="font-size:13px; color:#999; display:block; margin-bottom:4px;">Font</label>
  <select id="styleFontFamily" style="width:100%; padding:8px; margin-bottom:10px; background:#0f1015; color:#fff; border:1px solid #444; border-radius:8px;">
    <option value="'Segoe UI', Arial, sans-serif">Segoe UI (default)</option>
    <option value="Georgia, serif">Georgia (serif)</option>
    <option value="'Courier New', monospace">Courier New (mono)</option>
    <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
    <option value="Impact, sans-serif">Impact</option>
    <option value="Verdana, sans-serif">Verdana</option>
  </select>
  <label style="font-size:13px; color:#ccc; display:flex; align-items:center; gap:8px; margin-bottom:10px;">
    <input id="styleBold" type="checkbox"> Bold bullet text
  </label>
  <button id="applyStyleBtn" class="small">Apply style</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
  /* =========================================================
     PASTE YOUR FIREBASE CONFIG HERE (same one used in overlay.html)
     ========================================================= */
  const firebaseConfig = {
  apiKey: "AIzaSyA0BNDN63NtjldE7g8g131oc24u1DKGEgg",

  authDomain: "card-mastery.firebaseapp.com",

  projectId: "card-mastery",

  storageBucket: "card-mastery.firebasestorage.app",

  messagingSenderId: "19360834477",

  appId: "1:19360834477:web:8a1df5c084ce73eab73724",

  measurementId: "G-GPNPENMG39"
  };
  /* ========================================================= */

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const stateRef = db.ref('overlay/state');
  const cardsRef = db.ref('overlay/cards');
  const slidesRef = db.ref('overlay/slides');
  const imagesRef = db.ref('overlay/images');

  const statusEl = document.getElementById('status');
  const previewText = document.getElementById('previewText');
  const btnCards = document.getElementById('btnCards');
  const btnSlides = document.getElementById('btnSlides');
  const btnImages = document.getElementById('btnImages');
  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');
  const btnHide = document.getElementById('btnHide');
  const cardListUI = document.getElementById('cardListUI');
  const slideListUI = document.getElementById('slideListUI');
  const imageListUI = document.getElementById('imageListUI');
  const newCardInput = document.getElementById('newCardInput');
  const newSlideInput = document.getElementById('newSlideInput');
  const newSlideHeaderInput = document.getElementById('newSlideHeaderInput');
  const newImageInput = document.getElementById('newImageInput');
  const newImageLabel = document.getElementById('newImageLabel');
  const addCardBtn = document.getElementById('addCardBtn');
  const addSlideBtn = document.getElementById('addSlideBtn');
  const addImageBtn = document.getElementById('addImageBtn');
  const imageUploadStatus = document.getElementById('imageUploadStatus');
  const styleTextColor = document.getElementById('styleTextColor');
  const styleAccentColor = document.getElementById('styleAccentColor');
  const styleFontFamily = document.getElementById('styleFontFamily');
  const styleBold = document.getElementById('styleBold');
  const applyStyleBtn = document.getElementById('applyStyleBtn');
  const styleRef = db.ref('overlay/style');

  // Works whether a slide entry is the old plain-array format
  // or the new { header, bullets } format.
  function slideLabel(entry) {
    if (Array.isArray(entry)) return entry[0] || '';
    return entry.header || (entry.bullets && entry.bullets[0]) || '';
  }

  let mode = 'cards';
  let cardIndex = 0;
  let slideIndex = 0;
  let imageIndex = 0;
  let CARD_LIST = [];
  let SLIDES = [];
  let IMAGES = [];

  db.ref('.info/connected').on('value', (snap) => {
    statusEl.textContent = snap.val() ? 'connected' : 'disconnected — check your config';
  });

  function updatePreview() {
    btnCards.classList.toggle('active', mode === 'cards');
    btnSlides.classList.toggle('active', mode === 'slides');
    btnImages.classList.toggle('active', mode === 'images');
    if (mode === 'cards' && CARD_LIST[cardIndex] !== undefined) {
      previewText.textContent = CARD_LIST[cardIndex] + '  (' + (cardIndex + 1) + '/' + CARD_LIST.length + ')';
    } else if (mode === 'slides' && SLIDES[slideIndex] !== undefined) {
      previewText.textContent = slideLabel(SLIDES[slideIndex]) + '  (' + (slideIndex + 1) + '/' + SLIDES.length + ')';
    } else if (mode === 'images' && IMAGES[imageIndex] !== undefined) {
      previewText.textContent = (IMAGES[imageIndex].label || 'Image') + '  (' + (imageIndex + 1) + '/' + IMAGES.length + ')';
    } else {
      previewText.textContent = '—';
    }
  }

  function push() {
    stateRef.set({ mode, cardIndex, slideIndex, imageIndex, ts: Date.now() });
    updatePreview();
  }

  btnCards.addEventListener('click', () => { mode = 'cards'; push(); });
  btnSlides.addEventListener('click', () => { mode = 'slides'; push(); });
  btnImages.addEventListener('click', () => { mode = 'images'; push(); });

  btnNext.addEventListener('click', () => {
    if (mode === 'cards' && CARD_LIST.length) cardIndex = (cardIndex + 1) % CARD_LIST.length;
    else if (mode === 'slides' && SLIDES.length) slideIndex = (slideIndex + 1) % SLIDES.length;
    else if (mode === 'images' && IMAGES.length) imageIndex = (imageIndex + 1) % IMAGES.length;
    push();
  });

  btnPrev.addEventListener('click', () => {
    if (mode === 'cards' && CARD_LIST.length) cardIndex = (cardIndex - 1 + CARD_LIST.length) % CARD_LIST.length;
    else if (mode === 'slides' && SLIDES.length) slideIndex = (slideIndex - 1 + SLIDES.length) % SLIDES.length;
    else if (mode === 'images' && IMAGES.length) imageIndex = (imageIndex - 1 + IMAGES.length) % IMAGES.length;
    push();
  });

  btnHide.addEventListener('click', () => {
    stateRef.set({ mode: 'clear', ts: Date.now() });
  });

  // ===== Card list editor =====
  let dragFromIndex = null;

  function renderCardListUI() {
    cardListUI.innerHTML = '';
    CARD_LIST.forEach((name, i) => {
      const row = document.createElement('div');
      row.className = 'listItem' + (mode === 'cards' && i === cardIndex ? ' current' : '');
      row.draggable = true;

      const handle = document.createElement('span');
      handle.className = 'dragHandle';
      handle.textContent = '\u2630'; // ☰ drag handle icon
      handle.style.flex = '0';

      const label = document.createElement('span');
      label.textContent = name;

      const jumpBtn = document.createElement('button');
      jumpBtn.className = 'small';
      jumpBtn.textContent = 'Show';
      jumpBtn.addEventListener('click', () => { mode = 'cards'; cardIndex = i; push(); });
      const delBtn = document.createElement('button');
      delBtn.className = 'small';
      delBtn.textContent = 'Remove';
      delBtn.addEventListener('click', () => {
        const updated = CARD_LIST.slice();
        updated.splice(i, 1);
        cardsRef.set(updated);
      });

      row.appendChild(handle);
      row.appendChild(label);
      row.appendChild(jumpBtn);
      row.appendChild(delBtn);

      // Drag-and-drop reordering
      row.addEventListener('dragstart', () => {
        dragFromIndex = i;
        row.classList.add('dragging');
      });
      row.addEventListener('dragend', () => {
        row.classList.remove('dragging');
        dragFromIndex = null;
      });
      row.addEventListener('dragover', (e) => {
        e.preventDefault(); // allow dropping
      });
      row.addEventListener('drop', (e) => {
        e.preventDefault();
        if (dragFromIndex === null || dragFromIndex === i) return;
        const updated = CARD_LIST.slice();
        const [moved] = updated.splice(dragFromIndex, 1);
        updated.splice(i, 0, moved);
        cardsRef.set(updated);
      });

      cardListUI.appendChild(row);
    });
  }

  addCardBtn.addEventListener('click', () => {
    const name = newCardInput.value.trim();
    if (!name) return;
    cardsRef.set(CARD_LIST.concat([name]));
    newCardInput.value = '';
  });
  newCardInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addCardBtn.click();
  });

  // ===== Slide list editor =====
  function renderSlideListUI() {
    slideListUI.innerHTML = '';
    SLIDES.forEach((entry, i) => {
      const bullets = Array.isArray(entry) ? entry : (entry.bullets || []);
      const header = Array.isArray(entry) ? '' : (entry.header || '');
      const row = document.createElement('div');
      row.className = 'listItem' + (mode === 'slides' && i === slideIndex ? ' current' : '');
      row.innerHTML = '<span>' + (header ? '<strong>' + header + '</strong>: ' : '') + bullets.join(' · ') + '</span>';
      const jumpBtn = document.createElement('button');
      jumpBtn.className = 'small';
      jumpBtn.textContent = 'Show';
      jumpBtn.addEventListener('click', () => { mode = 'slides'; slideIndex = i; push(); });
      const delBtn = document.createElement('button');
      delBtn.className = 'small';
      delBtn.textContent = 'Remove';
      delBtn.addEventListener('click', () => {
        const updated = SLIDES.slice();
        updated.splice(i, 1);
        slidesRef.set(updated);
      });
      row.appendChild(jumpBtn);
      row.appendChild(delBtn);
      slideListUI.appendChild(row);
    });
  }

  addSlideBtn.addEventListener('click', () => {
    const lines = newSlideInput.value.split('\n').map(s => s.trim()).filter(Boolean);
    const header = newSlideHeaderInput.value.trim();
    if (!lines.length && !header) return;
    slidesRef.set(SLIDES.concat([{ header, bullets: lines }]));
    newSlideInput.value = '';
    newSlideHeaderInput.value = '';
  });

  // ===== Image uploader =====
  // Resizes/compresses on the client so the database stays small and fast.
  function fileToCompressedDataURL(file, maxWidth = 900, quality = 0.82) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Could not read file'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('Could not decode image'));
        img.onload = () => {
          const scale = Math.min(1, maxWidth / img.width);
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  addImageBtn.addEventListener('click', async () => {
    const file = newImageInput.files[0];
    if (!file) { imageUploadStatus.textContent = 'Choose a file first.'; return; }
    imageUploadStatus.textContent = 'Processing...';
    try {
      const dataUrl = await fileToCompressedDataURL(file);
      const label = newImageLabel.value.trim();
      imagesRef.set(IMAGES.concat([{ label, dataUrl }]));
      newImageInput.value = '';
      newImageLabel.value = '';
      imageUploadStatus.textContent = 'Added.';
      setTimeout(() => { imageUploadStatus.textContent = ''; }, 2000);
    } catch (e) {
      imageUploadStatus.textContent = 'Upload failed: ' + e.message;
    }
  });

  function renderImageListUI() {
    imageListUI.innerHTML = '';
    IMAGES.forEach((entry, i) => {
      const row = document.createElement('div');
      row.className = 'listItem' + (mode === 'images' && i === imageIndex ? ' current' : '');
      row.innerHTML = '<span>' + (entry.label || 'Image ' + (i + 1)) + '</span>';
      const jumpBtn = document.createElement('button');
      jumpBtn.className = 'small';
      jumpBtn.textContent = 'Show';
      jumpBtn.addEventListener('click', () => { mode = 'images'; imageIndex = i; push(); });
      const delBtn = document.createElement('button');
      delBtn.className = 'small';
      delBtn.textContent = 'Remove';
      delBtn.addEventListener('click', () => {
        const updated = IMAGES.slice();
        updated.splice(i, 1);
        imagesRef.set(updated);
      });
      row.appendChild(jumpBtn);
      row.appendChild(delBtn);
      imageListUI.appendChild(row);
    });
  }

  // Live-sync lists from Firebase so edits reflect instantly, including from other tabs
  cardsRef.on('value', (snap) => {
    CARD_LIST = snap.val() || [];
    if (cardIndex >= CARD_LIST.length) cardIndex = 0;
    renderCardListUI();
    updatePreview();
  });

  slidesRef.on('value', (snap) => {
    SLIDES = snap.val() || [];
    if (slideIndex >= SLIDES.length) slideIndex = 0;
    renderSlideListUI();
    updatePreview();
  });

  imagesRef.on('value', (snap) => {
    IMAGES = snap.val() || [];
    if (imageIndex >= IMAGES.length) imageIndex = 0;
    renderImageListUI();
    updatePreview();
  });

  // ===== Slide text style =====
  applyStyleBtn.addEventListener('click', () => {
    styleRef.set({
      textColor: styleTextColor.value,
      accentColor: styleAccentColor.value,
      fontFamily: styleFontFamily.value,
      bold: styleBold.checked
    });
  });

  // Reflect the currently-saved style in the controls (e.g. if you reload the page,
  // or your co-host changes it from their own tab)
  styleRef.on('value', (snap) => {
    const style = snap.val() || {};
    styleTextColor.value = style.textColor || '#ffffff';
    styleAccentColor.value = style.accentColor || '#f4c04a';
    styleFontFamily.value = style.fontFamily || "'Segoe UI', Arial, sans-serif";
    styleBold.checked = !!style.bold;
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (document.activeElement === newCardInput || document.activeElement === newSlideInput
        || document.activeElement === newSlideHeaderInput || document.activeElement === newImageLabel) return;
    if (e.key === 'ArrowRight') btnNext.click();
    else if (e.key === 'ArrowLeft') btnPrev.click();
    else if (e.key === '1') btnCards.click();
    else if (e.key === '2') btnSlides.click();
    else if (e.key === '3') btnImages.click();
    else if (e.key === 'Escape') btnHide.click();
  });

  updatePreview();
</script>

</body>
</html>
