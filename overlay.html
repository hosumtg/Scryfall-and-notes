<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Podcast Overlay (OBS source)</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
  }
  #stage { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  #frame {
    background: rgba(10, 12, 20, 0.88);
    border: 3px solid #f4c04a;
    border-radius: 20px;
    padding: 28px 36px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    max-width: 640px;
    min-width: 320px;
    opacity: 0;
    transform: scale(0.96);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  #frame.visible { opacity: 1; transform: scale(1); }
  #cardImg {
    display: block; max-width: 340px; width: 100%;
    border-radius: 16px; box-shadow: 0 6px 18px rgba(0,0,0,0.6);
  }
  #cardLoading { color: #f4c04a; font-size: 20px; text-align: center; padding: 20px 0; }
  #bulletList { list-style: none; margin: 0; padding: 0; color: #fff; font-size: 28px; line-height: 1.6; }
  #bulletList li {
    opacity: 0; transform: translateX(-16px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    margin-bottom: 6px;
  }
  #bulletList li::before { content: "\25B8  "; color: #f4c04a; }
  #bulletList li.shown { opacity: 1; transform: translateX(0); }
  #posLabel { text-align: center; color: #999; font-size: 13px; margin-top: 14px; letter-spacing: 0.5px; }
</style>
</head>
<body>

<div id="stage">
  <div id="frame">
    <div id="cardWrap" style="display:none;"><img id="cardImg" src="" alt="Magic card"></div>
    <div id="bulletWrap" style="display:none;"><ul id="bulletList"></ul></div>
    <div id="posLabel"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
  /* =========================================================
     PASTE YOUR FIREBASE CONFIG HERE (same one used in control.html)
     ========================================================= */
  const firebaseConfig = {
  apiKey: "AIzaSyA0BNDN63NtjldE7g8g131oc24u1DKGEgg",

  authDomain: "card-mastery.firebaseapp.com",

  projectId: "card-mastery",

  storageBucket: "card-mastery.firebasestorage.app",

  messagingSenderId: "19360834477",

  appId: "1:19360834477:web:8a1df5c084ce73eab73724",

  measurementId: "G-GPNPENMG39"
  };
  /* ========================================================= */

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const frame = document.getElementById('frame');
  const cardWrap = document.getElementById('cardWrap');
  const bulletWrap = document.getElementById('bulletWrap');
  const cardImg = document.getElementById('cardImg');
  const bulletList = document.getElementById('bulletList');
  const posLabel = document.getElementById('posLabel');

  // Cards and slides now live in Firebase, not hardcoded here.
  // You manage them entirely from control.html.
  let CARD_LIST = [];
  let SLIDES = [];
  let currentState = null;

  const cardImageCache = {};

  async function fetchCardImage(name) {
    if (cardImageCache[name]) return cardImageCache[name];
    const res = await fetch('https://api.scryfall.com/cards/named?fuzzy=' + encodeURIComponent(name));
    if (!res.ok) throw new Error('not found');
    const data = await res.json();
    const img = data.image_uris ? data.image_uris.normal
              : (data.card_faces && data.card_faces[0].image_uris ? data.card_faces[0].image_uris.normal : null);
    if (!img) throw new Error('no image');
    cardImageCache[name] = img;
    return img;
  }

  function preloadNewCards(list) {
    list.forEach(name => {
      if (!cardImageCache[name]) {
        fetchCardImage(name).catch(() => console.warn('Could not preload:', name));
      }
    });
  }

  function showFrame() { frame.classList.add('visible'); }
  function hideFrame() { frame.classList.remove('visible'); }

  async function renderCard(index) {
    const name = CARD_LIST[index];
    if (!name) { hideFrame(); return; }
    cardWrap.style.display = 'block';
    bulletWrap.style.display = 'none';
    posLabel.textContent = 'Card ' + (index + 1) + ' / ' + CARD_LIST.length;
    showFrame();
    try {
      const img = await fetchCardImage(name);
      cardWrap.innerHTML = '';
      const im = document.createElement('img');
      im.id = 'cardImg';
      im.src = img;
      cardWrap.appendChild(im);
    } catch (e) {
      cardWrap.innerHTML = '<div id="cardLoading">Card not found: ' + name + '</div>';
    }
  }

  function renderSlide(index) {
    const lines = SLIDES[index];
    if (!lines) { hideFrame(); return; }
    cardWrap.style.display = 'none';
    bulletWrap.style.display = 'block';
    bulletList.innerHTML = '';
    lines.forEach((line, i) => {
      const li = document.createElement('li');
      li.textContent = line;
      bulletList.appendChild(li);
      setTimeout(() => li.classList.add('shown'), 120 * i);
    });
    posLabel.textContent = 'Slide ' + (index + 1) + ' / ' + SLIDES.length;
    showFrame();
  }

  function renderCurrent() {
    if (!currentState) return;
    if (currentState.mode === 'cards') renderCard(currentState.cardIndex || 0);
    else if (currentState.mode === 'slides') renderSlide(currentState.slideIndex || 0);
    else if (currentState.mode === 'clear') hideFrame();
  }

  // Live-sync the card list
  db.ref('overlay/cards').on('value', (snap) => {
    CARD_LIST = snap.val() || [];
    preloadNewCards(CARD_LIST);
    renderCurrent();
  });

  // Live-sync the slide list
  db.ref('overlay/slides').on('value', (snap) => {
    SLIDES = snap.val() || [];
    renderCurrent();
  });

  // Live-sync what should currently be displayed
  db.ref('overlay/state').on('value', (snap) => {
    currentState = snap.val();
    renderCurrent();
  });
</script>

</body>
</html>
