<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Podcast Overlay (OBS source — 1920x1080)</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 1920px; height: 1080px;
    background: transparent;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
  }
  #canvas { position: relative; width: 1920px; height: 1080px; }

  /* ===== Content zone (cards / slides / images) ===== */
  #contentZone {
    position: absolute;
    left: 650px; top: 540px;
    transform: translate(-50%, -50%) scale(1);
  }
  #contentInner {
    padding: 24px 30px;
    border-radius: 20px;
    background: transparent;
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  #contentInner.visible { opacity: 1; }

  #cardImg { display: block; max-width: 420px; width: 100%; border-radius: 16px; box-shadow: 0 6px 18px rgba(0,0,0,0.6); }
  #cardLoading { color: #f4c04a; font-size: 20px; text-align: center; padding: 20px 0; }
  #customImg { display: block; max-width: 480px; width: 100%; border-radius: 16px; box-shadow: 0 6px 18px rgba(0,0,0,0.6); }

  :root {
    --slide-text-color: #ffffff;
    --slide-accent-color: #f4c04a;
    --slide-font-family: 'Segoe UI', Arial, sans-serif;
    --slide-font-weight: 400;
  }
  #slideHeader {
    color: var(--slide-accent-color);
    font-family: var(--slide-font-family);
    font-size: 32px; font-weight: 700; margin-bottom: 12px;
  }
  #bulletList {
    list-style: none; margin: 0; padding: 0;
    color: var(--slide-text-color);
    font-family: var(--slide-font-family);
    font-weight: var(--slide-font-weight);
    font-size: 28px; line-height: 1.6;
  }
  #bulletList li {
    opacity: 0; transform: translateX(-16px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    margin-bottom: 6px;
  }
  #bulletList li::before { content: "\2022  "; color: var(--slide-accent-color); }
  #bulletList li.shown { opacity: 1; transform: translateX(0); }

  /* ===== Webcam boxes ===== */
  .camBox {
    position: absolute;
    transform: translate(-50%, -50%);
    overflow: hidden;
  }
  .camBox video {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .camBox .namePlate {
    position: absolute;
    left: 10px; bottom: 10px;
    background: rgba(10, 12, 20, 0.82);
    border-radius: 8px;
    padding: 4px 12px;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .camBox .deviceBar { position: absolute; top: 8px; right: 8px; z-index: 5; }
  .camBox .deviceBar select {
    background: rgba(0,0,0,0.7); color: #fff;
    border: 1px solid #f4c04a; border-radius: 6px;
    font-size: 11px; padding: 3px 5px; max-width: 140px;
  }
  .camBox .permissionPrompt {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px;
    background: rgba(10,12,20,0.9);
    text-align: center; padding: 14px;
  }
  .camBox .permissionPrompt p { color: #ccc; font-size: 12px; max-width: 220px; margin: 0; }
  .camBox .permissionPrompt button {
    background: #f4c04a; color: #1a1300; border: none; border-radius: 8px;
    padding: 8px 16px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>

<div id="canvas">

  <div id="contentZone">
    <div id="contentInner">
      <div id="cardWrap" style="display:none;"><img id="cardImg" src="" alt="Magic card"></div>
      <div id="bulletWrap" style="display:none;">
        <div id="slideHeader" style="display:none;"></div>
        <ul id="bulletList"></ul>
      </div>
      <div id="imageWrap" style="display:none;"><img id="customImg" src="" alt="Uploaded image"></div>
    </div>
  </div>

  <div id="cam1Box" class="camBox">
    <video id="cam1Video" autoplay playsinline muted></video>
    <div class="namePlate" id="cam1Name"></div>
    <div class="deviceBar"><select id="cam1DeviceSelect"><option>Loading...</option></select></div>
    <div class="permissionPrompt" id="cam1Prompt">
      <p>Camera 1 needs access. Right-click this source in OBS &rarr; Interact, then click below.</p>
      <button id="cam1GrantBtn">Enable camera 1</button>
      <p id="cam1Error" style="color:#ff8080; font-size:11px; margin-top:6px;"></p>
    </div>
  </div>

  <div id="cam2Box" class="camBox">
    <video id="cam2Video" autoplay playsinline muted></video>
    <div class="namePlate" id="cam2Name"></div>
    <div class="deviceBar"><select id="cam2DeviceSelect"><option>Loading...</option></select></div>
    <div class="permissionPrompt" id="cam2Prompt">
      <p>Camera 2 needs access. Right-click this source in OBS &rarr; Interact, then click below.</p>
      <button id="cam2GrantBtn">Enable camera 2</button>
      <p id="cam2Error" style="color:#ff8080; font-size:11px; margin-top:6px;"></p>
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
  /* =========================================================
     FIREBASE CONFIG
     ========================================================= */
  const firebaseConfig = {
    apiKey: "AIzaSyA0BNDN63NtjldE7g8g131oc24u1DKGEgg",
    authDomain: "card-mastery.firebaseapp.com",
    projectId: "card-mastery",
    storageBucket: "card-mastery.firebasestorage.app",
    messagingSenderId: "19360834477",
    appId: "1:19360834477:web:8a1df5c084ce73eab73724",
    measurementId: "G-GPNPENMG39"
  };
  /* ========================================================= */

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  /* ============ Content zone (cards / slides / images) ============ */
  const contentZone = document.getElementById('contentZone');
  const contentInner = document.getElementById('contentInner');
  const cardWrap = document.getElementById('cardWrap');
  const bulletWrap = document.getElementById('bulletWrap');
  const cardImg = document.getElementById('cardImg');
  const bulletList = document.getElementById('bulletList');
  const slideHeader = document.getElementById('slideHeader');
  const imageWrap = document.getElementById('imageWrap');
  const customImg = document.getElementById('customImg');

  let CARD_LIST = [];
  let SLIDES = [];
  let IMAGES = [];
  let currentState = null;

  const cardImageCache = {};

  async function fetchCardImage(name) {
    if (cardImageCache[name]) return cardImageCache[name];
    const res = await fetch('https://api.scryfall.com/cards/named?fuzzy=' + encodeURIComponent(name));
    if (!res.ok) throw new Error('not found');
    const data = await res.json();
    const uris = data.image_uris || (data.card_faces && data.card_faces[0].image_uris);
    const img = uris ? (uris.png || uris.large || uris.normal) : null;
    if (!img) throw new Error('no image');
    cardImageCache[name] = img;
    return img;
  }

  function preloadNewCards(list) {
    list.forEach(name => {
      if (!cardImageCache[name]) {
        fetchCardImage(name).catch(() => console.warn('Could not preload:', name));
      }
    });
  }

  function showContent() { contentInner.classList.add('visible'); }
  function hideContent() { contentInner.classList.remove('visible'); }

  async function renderCard(index) {
    const name = CARD_LIST[index];
    if (!name) { hideContent(); return; }
    cardWrap.style.display = 'block';
    bulletWrap.style.display = 'none';
    imageWrap.style.display = 'none';
    showContent();
    try {
      const img = await fetchCardImage(name);
      cardWrap.innerHTML = '';
      const im = document.createElement('img');
      im.id = 'cardImg';
      im.src = img;
      cardWrap.appendChild(im);
    } catch (e) {
      cardWrap.innerHTML = '<div id="cardLoading">Card not found: ' + name + '</div>';
    }
  }

  function renderSlide(index) {
    const entry = SLIDES[index];
    if (!entry) { hideContent(); return; }
    const header = Array.isArray(entry) ? '' : (entry.header || '');
    const lines = Array.isArray(entry) ? entry : (entry.bullets || []);

    cardWrap.style.display = 'none';
    bulletWrap.style.display = 'block';
    imageWrap.style.display = 'none';

    if (header) {
      slideHeader.textContent = header;
      slideHeader.style.display = 'block';
    } else {
      slideHeader.style.display = 'none';
    }

    bulletList.innerHTML = '';
    lines.forEach((line, i) => {
      const li = document.createElement('li');
      li.textContent = line;
      bulletList.appendChild(li);
      setTimeout(() => li.classList.add('shown'), 120 * i);
    });
    showContent();
  }

  function renderImage(index) {
    const entry = IMAGES[index];
    if (!entry) { hideContent(); return; }
    cardWrap.style.display = 'none';
    bulletWrap.style.display = 'none';
    imageWrap.style.display = 'block';
    customImg.src = entry.dataUrl;
    showContent();
  }

  function renderCurrent() {
    if (!currentState) return;
    if (currentState.mode === 'cards') renderCard(currentState.cardIndex || 0);
    else if (currentState.mode === 'slides') renderSlide(currentState.slideIndex || 0);
    else if (currentState.mode === 'images') renderImage(currentState.imageIndex || 0);
    else if (currentState.mode === 'clear') hideContent();
  }

  db.ref('overlay/cards').on('value', (snap) => {
    CARD_LIST = snap.val() || [];
    preloadNewCards(CARD_LIST);
    renderCurrent();
  });
  db.ref('overlay/slides').on('value', (snap) => {
    SLIDES = snap.val() || [];
    renderCurrent();
  });
  db.ref('overlay/images').on('value', (snap) => {
    IMAGES = snap.val() || [];
    renderCurrent();
  });
  db.ref('overlay/style').on('value', (snap) => {
    const style = snap.val() || {};
    const root = document.documentElement.style;
    root.setProperty('--slide-text-color', style.textColor || '#ffffff');
    root.setProperty('--slide-accent-color', style.accentColor || '#f4c04a');
    root.setProperty('--slide-font-family', style.fontFamily || "'Segoe UI', Arial, sans-serif");
    root.setProperty('--slide-font-weight', style.bold ? '700' : '400');
  });
  db.ref('overlay/state').on('value', (snap) => {
    currentState = snap.val();
    renderCurrent();
  });

  /* ============ Layout (position / size / style for everything) ============ */
  const DEFAULT_LAYOUT = {
    content: { centerX: 650, centerY: 540, scale: 1, bgEnabled: false, bgColor: '#0a0c14', bgOpacity: 0.85, cornerRadius: 20 },
    cam1: { centerX: 1670, centerY: 280, width: 500, height: 320, name: 'Host 1', nameplateEnabled: true, cornerRadius: 18 },
    cam2: { centerX: 1670, centerY: 700, width: 500, height: 320, name: 'Host 2', nameplateEnabled: true, cornerRadius: 18 }
  };

  const cam1Box = document.getElementById('cam1Box');
  const cam2Box = document.getElementById('cam2Box');
  const cam1Name = document.getElementById('cam1Name');
  const cam2Name = document.getElementById('cam2Name');

  function applyLayout(layout) {
    const c = Object.assign({}, DEFAULT_LAYOUT.content, layout.content);
    const c1 = Object.assign({}, DEFAULT_LAYOUT.cam1, layout.cam1);
    const c2 = Object.assign({}, DEFAULT_LAYOUT.cam2, layout.cam2);

    contentZone.style.left = c.centerX + 'px';
    contentZone.style.top = c.centerY + 'px';
    contentZone.style.transform = 'translate(-50%, -50%) scale(' + c.scale + ')';
    contentInner.style.borderRadius = c.cornerRadius + 'px';
    if (c.bgEnabled) {
      const hex = c.bgColor.replace('#', '');
      const r = parseInt(hex.substring(0,2), 16);
      const g = parseInt(hex.substring(2,4), 16);
      const b = parseInt(hex.substring(4,6), 16);
      contentInner.style.background = 'rgba(' + r + ',' + g + ',' + b + ',' + c.bgOpacity + ')';
    } else {
      contentInner.style.background = 'transparent';
    }

    cam1Box.style.left = c1.centerX + 'px';
    cam1Box.style.top = c1.centerY + 'px';
    cam1Box.style.width = c1.width + 'px';
    cam1Box.style.height = c1.height + 'px';
    cam1Box.style.borderRadius = c1.cornerRadius + 'px';
    cam1Name.style.display = c1.nameplateEnabled ? 'block' : 'none';
    cam1Name.textContent = c1.name;

    cam2Box.style.left = c2.centerX + 'px';
    cam2Box.style.top = c2.centerY + 'px';
    cam2Box.style.width = c2.width + 'px';
    cam2Box.style.height = c2.height + 'px';
    cam2Box.style.borderRadius = c2.cornerRadius + 'px';
    cam2Name.style.display = c2.nameplateEnabled ? 'block' : 'none';
    cam2Name.textContent = c2.name;
  }

  applyLayout({});
  db.ref('overlay/layout').on('value', (snap) => {
    applyLayout(snap.val() || {});
  });

  /* ============ Webcams (local devices — not synced via Firebase) ============ */
  function setupCamera(videoEl, selectEl, promptEl, grantBtnId, storageKey, errorElId) {
    let stream = null;
    const errorEl = document.getElementById(errorElId);

    function showError(err) {
      if (errorEl) errorEl.textContent = (err && (err.name + ': ' + err.message)) || String(err);
      promptEl.style.display = 'flex';
    }

    async function start(deviceId) {
      if (stream) stream.getTracks().forEach(t => t.stop());
      const constraints = { video: deviceId ? { deviceId: { exact: deviceId } } : true, audio: false };
      stream = await navigator.mediaDevices.getUserMedia(constraints);
      videoEl.srcObject = stream;
      promptEl.style.display = 'none';
      if (errorEl) errorEl.textContent = '';
      if (deviceId) localStorage.setItem(storageKey, deviceId);
      await populateDevices();
    }

    async function populateDevices() {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const cams = devices.filter(d => d.kind === 'videoinput');
      selectEl.innerHTML = '';
      cams.forEach((cam, i) => {
        const opt = document.createElement('option');
        opt.value = cam.deviceId;
        opt.textContent = cam.label || ('Camera ' + (i + 1));
        selectEl.appendChild(opt);
      });
      const saved = localStorage.getItem(storageKey);
      if (saved && cams.some(c => c.deviceId === saved)) selectEl.value = saved;
    }

    selectEl.addEventListener('change', () => {
      start(selectEl.value).catch(showError);
    });

    document.getElementById(grantBtnId).addEventListener('click', () => {
      const saved = localStorage.getItem(storageKey);
      start(saved || undefined).catch(showError);
    });

    const saved = localStorage.getItem(storageKey);
    start(saved || undefined).catch(showError);
  }

  setupCamera(
    document.getElementById('cam1Video'),
    document.getElementById('cam1DeviceSelect'),
    document.getElementById('cam1Prompt'),
    'cam1GrantBtn',
    'cam1DeviceId',
    'cam1Error'
  );
  setupCamera(
    document.getElementById('cam2Video'),
    document.getElementById('cam2DeviceSelect'),
    document.getElementById('cam2Prompt'),
    'cam2GrantBtn',
    'cam2DeviceId',
    'cam2Error'
  );
</script>

</body>
</html>
