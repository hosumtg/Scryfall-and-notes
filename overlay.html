<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Podcast Overlay (OBS source — 1920x1080)</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 1920px; height: 1080px;
    background: transparent;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
  }
  #canvas { position: relative; width: 1920px; height: 1080px; }

  #bgLayer {
    position: absolute; inset: 0;
    width: 1920px; height: 1080px;
    overflow: hidden;
  }
  #bgLayer img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transform: scale(1.08);
    filter: blur(var(--bg-blur, 0px));
  }

  /* ===== Content zone (cards / slides / images) ===== */
  #contentZone {
    position: absolute;
    left: 650px; top: 540px;
    width: max-content;
    transform: translate(-50%, -50%) scale(1);
  }
  #contentInner {
    padding: 24px 30px;
    border-radius: 20px;
    background: transparent;
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  #contentInner.visible { opacity: 1; }

  #cardImg { display: block; max-width: 420px; width: 100%; border-radius: 16px; box-shadow: 0 6px 18px rgba(0,0,0,0.6); }
  #cardLoading { color: #f4c04a; font-size: 20px; text-align: center; padding: 20px 0; }
  #customImg { display: block; max-width: 480px; width: 100%; border-radius: 16px; box-shadow: 0 6px 18px rgba(0,0,0,0.6); }

  #pairHeader {
    color: var(--slide-accent-color);
    font-family: var(--slide-font-family);
    font-size: 32px; font-weight: 700;
    text-align: center;
    margin-bottom: 14px;
  }
  #pairCards { display: flex; gap: 24px; align-items: flex-start; justify-content: center; }
  .pairSlot { display: flex; flex-direction: column; align-items: center; }
  #pairCards img { display: block; max-width: 320px; width: 100%; border-radius: 16px; box-shadow: 0 6px 18px rgba(0,0,0,0.6); }
  .pairLoading { color: #f4c04a; font-size: 18px; text-align: center; padding: 20px; width: 320px; }

  #groupHeader {
    color: var(--slide-accent-color);
    font-family: var(--slide-font-family);
    font-size: 32px; font-weight: 700;
    text-align: center;
    margin-bottom: 14px;
  }
  #groupCardsRow { display: flex; gap: 20px; align-items: flex-start; justify-content: center; flex-wrap: wrap; }
  .groupCardImg { display: block; max-width: 280px; width: 100%; border-radius: 16px; box-shadow: 0 6px 18px rgba(0,0,0,0.6); }
  .groupCardLoading { color: #f4c04a; font-size: 16px; text-align: center; padding: 16px; width: 280px; }

  /* ===== Secondary card slot (always-on, shows however many cards you add) ===== */
  #secondaryZone {
    position: absolute;
    left: 300px; top: 900px;
    width: max-content;
    transform: translate(-50%, -50%) scale(1);
  }
  #secondaryInner {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 16px;
    padding: 16px;
    border-radius: 16px;
    background: transparent;
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  #secondaryInner.visible { opacity: 1; }
  .secondaryCardImg { display: block; max-width: 260px; width: 100%; border-radius: 14px; box-shadow: 0 6px 18px rgba(0,0,0,0.6); }
  .secondaryCardLoading { color: #f4c04a; font-size: 15px; text-align: center; padding: 14px; width: 260px; }

  :root {
    --slide-text-color: #ffffff;
    --slide-accent-color: #f4c04a;
    --slide-font-family: 'Segoe UI', Arial, sans-serif;
    --slide-font-weight: 400;
  }
  #slideHeader {
    color: var(--slide-accent-color);
    font-family: var(--slide-font-family);
    font-size: 32px; font-weight: 700; margin-bottom: 12px;
  }
  #bulletList {
    list-style: none; margin: 0; padding: 0;
    color: var(--slide-text-color);
    font-family: var(--slide-font-family);
    font-weight: var(--slide-font-weight);
    font-size: 28px; line-height: 1.6;
  }
  #bulletList li {
    opacity: 0; transform: translateX(-16px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    margin-bottom: 6px;
  }
  #bulletList li::before { content: "\2022  "; color: var(--slide-accent-color); }
  #bulletList li.shown { opacity: 1; transform: translateX(0); }

  /* ===== Webcam frame rectangles (border only — actual camera feed comes from a separate OBS source layered underneath) ===== */
  .camBox {
    position: absolute;
    transform: translate(-50%, -50%);
    box-sizing: border-box;
    background: transparent;
  }
  .camBox .namePlate {
    position: absolute;
    left: 10px; bottom: 10px;
    background: rgba(10, 12, 20, 0.82);
    border-radius: 8px;
    padding: 4px 12px;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>

<div id="canvas">

  <div id="bgLayer" style="display:none;"><img id="bgImage" src="" alt=""></div>

  <div id="contentZone">
    <div id="contentInner">
      <div id="cardWrap" style="display:none;"><img id="cardImg" src="" alt="Magic card"></div>
      <div id="bulletWrap" style="display:none;">
        <div id="slideHeader" style="display:none;"></div>
        <ul id="bulletList"></ul>
      </div>
      <div id="imageWrap" style="display:none;"><img id="customImg" src="" alt="Uploaded image"></div>
      <div id="pairWrap" style="display:none;">
        <div id="pairHeader" style="display:none;"></div>
        <div id="pairCards">
          <div class="pairSlot">
            <img id="pairImg1" src="" alt="Magic card 1">
            <div id="pairLoading1" class="pairLoading" style="display:none;"></div>
          </div>
          <div class="pairSlot">
            <img id="pairImg2" src="" alt="Magic card 2">
            <div id="pairLoading2" class="pairLoading" style="display:none;"></div>
          </div>
        </div>
      </div>
      <div id="groupWrap" style="display:none;">
        <div id="groupHeader" style="display:none;"></div>
        <div id="groupCardsRow"></div>
      </div>
    </div>
  </div>

  <div id="secondaryZone">
    <div id="secondaryInner"></div>
  </div>

  <div id="cam1Box" class="camBox">
    <div class="namePlate" id="cam1Name"></div>
  </div>

  <div id="cam2Box" class="camBox">
    <div class="namePlate" id="cam2Name"></div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
  /* =========================================================
     FIREBASE CONFIG
     ========================================================= */
  const firebaseConfig = {
    apiKey: "AIzaSyA0BNDN63NtjldE7g8g131oc24u1DKGEgg",
    authDomain: "card-mastery.firebaseapp.com",
    projectId: "card-mastery",
    storageBucket: "card-mastery.firebasestorage.app",
    messagingSenderId: "19360834477",
    appId: "1:19360834477:web:8a1df5c084ce73eab73724",
    measurementId: "G-GPNPENMG39"
  };
  /* ========================================================= */

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  /* ============ Content zone (cards / slides / images) ============ */
  const contentZone = document.getElementById('contentZone');
  const contentInner = document.getElementById('contentInner');
  const cardWrap = document.getElementById('cardWrap');
  const bulletWrap = document.getElementById('bulletWrap');
  const cardImg = document.getElementById('cardImg');
  const bulletList = document.getElementById('bulletList');
  const slideHeader = document.getElementById('slideHeader');
  const imageWrap = document.getElementById('imageWrap');
  const customImg = document.getElementById('customImg');
  const pairWrap = document.getElementById('pairWrap');
  const pairHeader = document.getElementById('pairHeader');
  const pairCards = document.getElementById('pairCards');
  const pairImg1 = document.getElementById('pairImg1');
  const pairImg2 = document.getElementById('pairImg2');
  const pairLoading1 = document.getElementById('pairLoading1');
  const pairLoading2 = document.getElementById('pairLoading2');
  const groupWrap = document.getElementById('groupWrap');
  const groupHeader = document.getElementById('groupHeader');
  const groupCardsRow = document.getElementById('groupCardsRow');
  const secondaryZone = document.getElementById('secondaryZone');
  const secondaryInner = document.getElementById('secondaryInner');

  let CARD_LIST = [];
  let SLIDES = [];
  let IMAGES = [];
  let PAIRS = [];
  let SECONDARY_CARDS = [];
  let currentState = null;

  const cardImageCache = {};

  function cardCacheKey(entry) {
    if (typeof entry === 'string') return 'name:' + entry;
    return 'setnum:' + entry.set + '/' + entry.number;
  }

  function cardDisplayName(entry) {
    return typeof entry === 'string' ? entry : (entry.name || (entry.set + ' #' + entry.number));
  }

  async function fetchCardImage(entry) {
    const key = cardCacheKey(entry);
    if (cardImageCache[key]) return cardImageCache[key];
    const url = typeof entry === 'string'
      ? 'https://api.scryfall.com/cards/named?fuzzy=' + encodeURIComponent(entry)
      : 'https://api.scryfall.com/cards/' + encodeURIComponent(entry.set) + '/' + encodeURIComponent(entry.number);
    const res = await fetch(url);
    if (!res.ok) throw new Error('not found');
    const data = await res.json();
    const uris = data.image_uris || (data.card_faces && data.card_faces[0].image_uris);
    const img = uris ? (uris.png || uris.large || uris.normal) : null;
    if (!img) throw new Error('no image');
    cardImageCache[key] = img;
    return img;
  }

  function preloadNewCards(list) {
    list.forEach(entry => {
      const key = cardCacheKey(entry);
      if (!cardImageCache[key]) {
        fetchCardImage(entry).catch(() => console.warn('Could not preload:', cardDisplayName(entry)));
      }
    });
  }

  function showContent() { contentInner.classList.add('visible'); }
  function hideContent() { contentInner.classList.remove('visible'); }

  function isGroupEntry(entry) {
    return entry && typeof entry === 'object' && Array.isArray(entry.cards);
  }

  async function renderCard(index) {
    const entry = CARD_LIST[index];
    if (!entry) { hideContent(); return; }

    if (isGroupEntry(entry)) {
      await renderGroup(entry);
      return;
    }

    cardWrap.style.display = 'block';
    bulletWrap.style.display = 'none';
    imageWrap.style.display = 'none';
    pairWrap.style.display = 'none';
    groupWrap.style.display = 'none';
    showContent();
    try {
      const img = await fetchCardImage(entry);
      cardWrap.innerHTML = '';
      const im = document.createElement('img');
      im.id = 'cardImg';
      im.src = img;
      cardWrap.appendChild(im);
    } catch (e) {
      cardWrap.innerHTML = '<div id="cardLoading">Card not found: ' + cardDisplayName(entry) + '</div>';
    }
  }

  async function renderGroup(entry) {
    cardWrap.style.display = 'none';
    bulletWrap.style.display = 'none';
    imageWrap.style.display = 'none';
    pairWrap.style.display = 'none';
    groupWrap.style.display = 'block';

    if (entry.header) {
      groupHeader.textContent = entry.header;
      groupHeader.style.display = 'block';
    } else {
      groupHeader.style.display = 'none';
    }

    groupCardsRow.innerHTML = '';
    const slots = entry.cards.map(() => {
      const wrap = document.createElement('div');
      const img = document.createElement('img');
      img.className = 'groupCardImg';
      const loading = document.createElement('div');
      loading.className = 'groupCardLoading';
      loading.style.display = 'none';
      wrap.appendChild(img);
      wrap.appendChild(loading);
      groupCardsRow.appendChild(wrap);
      return { img, loading };
    });

    showContent();

    await Promise.all(entry.cards.map(async (cardEntry, i) => {
      const { img, loading } = slots[i];
      if (!cardEntry || (typeof cardEntry === 'object' && !cardEntry.name && !(cardEntry.set && cardEntry.number))) {
        img.style.display = 'none';
        loading.textContent = 'Empty or invalid card entry in this group';
        loading.style.display = 'block';
        return;
      }
      try {
        img.src = await fetchCardImage(cardEntry);
      } catch (e) {
        img.style.display = 'none';
        loading.textContent = 'Card not found: ' + cardDisplayName(cardEntry);
        loading.style.display = 'block';
      }
    }));
  }

  function renderSlide(index) {
    const entry = SLIDES[index];
    if (!entry) { hideContent(); return; }
    const header = Array.isArray(entry) ? '' : (entry.header || '');
    const lines = Array.isArray(entry) ? entry : (entry.bullets || []);

    cardWrap.style.display = 'none';
    bulletWrap.style.display = 'block';
    imageWrap.style.display = 'none';
    pairWrap.style.display = 'none';
    groupWrap.style.display = 'none';

    if (header) {
      slideHeader.textContent = header;
      slideHeader.style.display = 'block';
    } else {
      slideHeader.style.display = 'none';
    }

    bulletList.innerHTML = '';
    lines.forEach((line, i) => {
      const li = document.createElement('li');
      li.textContent = line;
      bulletList.appendChild(li);
      setTimeout(() => li.classList.add('shown'), 120 * i);
    });
    showContent();
  }

  function renderImage(index) {
    const entry = IMAGES[index];
    if (!entry) { hideContent(); return; }
    cardWrap.style.display = 'none';
    bulletWrap.style.display = 'none';
    imageWrap.style.display = 'block';
    pairWrap.style.display = 'none';
    groupWrap.style.display = 'none';
    customImg.src = entry.dataUrl;
    showContent();
  }

  async function renderPair(index) {
    const entry = PAIRS[index];
    if (!entry) { hideContent(); return; }
    cardWrap.style.display = 'none';
    bulletWrap.style.display = 'none';
    imageWrap.style.display = 'none';
    pairWrap.style.display = 'block';
    groupWrap.style.display = 'none';

    if (entry.header) {
      pairHeader.textContent = entry.header;
      pairHeader.style.display = 'block';
    } else {
      pairHeader.style.display = 'none';
    }

    showContent();

    async function loadInto(imgEl, loadingEl, name) {
      if (!name) { imgEl.style.display = 'none'; loadingEl.style.display = 'none'; return; }
      imgEl.style.display = 'block';
      loadingEl.style.display = 'none';
      try {
        imgEl.src = await fetchCardImage(name);
      } catch (e) {
        imgEl.style.display = 'none';
        loadingEl.textContent = 'Card not found: ' + name;
        loadingEl.style.display = 'block';
      }
    }

    await Promise.all([
      loadInto(pairImg1, pairLoading1, entry.card1),
      loadInto(pairImg2, pairLoading2, entry.card2)
    ]);
  }

  function renderCurrent() {
    if (!currentState) return;
    if (currentState.mode === 'cards') renderCard(currentState.cardIndex || 0);
    else if (currentState.mode === 'slides') renderSlide(currentState.slideIndex || 0);
    else if (currentState.mode === 'images') renderImage(currentState.imageIndex || 0);
    else if (currentState.mode === 'pairs') renderPair(currentState.pairIndex || 0);
    else if (currentState.mode === 'clear') hideContent();
  }

  db.ref('overlay/cards').on('value', (snap) => {
    CARD_LIST = snap.val() || [];
    // Flatten group entries so nested cards get preloaded too, not just top-level ones.
    const flat = [];
    CARD_LIST.forEach(entry => {
      if (isGroupEntry(entry)) flat.push(...entry.cards);
      else flat.push(entry);
    });
    preloadNewCards(flat);
    renderCurrent();
  });

  db.ref('overlay/pairs').on('value', (snap) => {
    PAIRS = snap.val() || [];
    const names = [];
    PAIRS.forEach(p => { if (p.card1) names.push(p.card1); if (p.card2) names.push(p.card2); });
    preloadNewCards(names);
    renderCurrent();
  });

  /* ============ Secondary card slot — always-on, shows every card in the list ============ */
  async function renderSecondary() {
    if (!SECONDARY_CARDS.length) {
      secondaryInner.classList.remove('visible');
      return;
    }
    secondaryInner.innerHTML = '';
    const slots = SECONDARY_CARDS.map(() => {
      const wrap = document.createElement('div');
      const img = document.createElement('img');
      img.className = 'secondaryCardImg';
      const loading = document.createElement('div');
      loading.className = 'secondaryCardLoading';
      loading.style.display = 'none';
      wrap.appendChild(img);
      wrap.appendChild(loading);
      secondaryInner.appendChild(wrap);
      return { img, loading };
    });
    secondaryInner.classList.add('visible');

    await Promise.all(SECONDARY_CARDS.map(async (entry, i) => {
      const { img, loading } = slots[i];
      try {
        img.src = await fetchCardImage(entry);
      } catch (e) {
        img.style.display = 'none';
        loading.textContent = 'Card not found: ' + cardDisplayName(entry);
        loading.style.display = 'block';
      }
    }));
  }

  db.ref('overlay/secondaryCards').on('value', (snap) => {
    SECONDARY_CARDS = snap.val() || [];
    preloadNewCards(SECONDARY_CARDS);
    renderSecondary();
  });

  db.ref('overlay/slides').on('value', (snap) => {
    SLIDES = snap.val() || [];
    renderCurrent();
  });
  db.ref('overlay/images').on('value', (snap) => {
    IMAGES = snap.val() || [];
    renderCurrent();
  });
  db.ref('overlay/style').on('value', (snap) => {
    const style = snap.val() || {};
    const root = document.documentElement.style;
    root.setProperty('--slide-text-color', style.textColor || '#ffffff');
    root.setProperty('--slide-accent-color', style.accentColor || '#f4c04a');
    root.setProperty('--slide-font-family', style.fontFamily || "'Segoe UI', Arial, sans-serif");
    root.setProperty('--slide-font-weight', style.bold ? '700' : '400');
  });

  /* ============ Background image ============ */
  const bgLayer = document.getElementById('bgLayer');
  const bgImage = document.getElementById('bgImage');
  db.ref('overlay/background').on('value', (snap) => {
    const bg = snap.val();
    if (bg && bg.enabled && bg.dataUrl) {
      bgImage.src = bg.dataUrl;
      document.documentElement.style.setProperty('--bg-blur', (bg.blur || 0) + 'px');
      bgLayer.style.display = 'block';
    } else {
      bgLayer.style.display = 'none';
    }
  });

  db.ref('overlay/state').on('value', (snap) => {
    currentState = snap.val();
    renderCurrent();
  });

  /* ============ Layout (position / size / style for everything) ============ */
  const DEFAULT_LAYOUT = {
    content: { centerX: 650, centerY: 540, scale: 1, bgEnabled: false, bgColor: '#0a0c14', bgOpacity: 0.85, cornerRadius: 20 },
    secondary: { centerX: 300, centerY: 950, scale: 0.6, gap: 16, enabled: false, bgEnabled: false, bgColor: '#0a0c14', bgOpacity: 0.85, cornerRadius: 16 },
    cam1: { centerX: 1670, centerY: 280, width: 500, height: 320, name: 'Host 1', nameplateEnabled: true, cornerRadius: 18, enabled: false, borderColor: '#f4c04a', borderWidth: 4 },
    cam2: { centerX: 1670, centerY: 700, width: 500, height: 320, name: 'Host 2', nameplateEnabled: true, cornerRadius: 18, enabled: false, borderColor: '#f4c04a', borderWidth: 4 }
  };

  const cam1Box = document.getElementById('cam1Box');
  const cam2Box = document.getElementById('cam2Box');
  const cam1Name = document.getElementById('cam1Name');
  const cam2Name = document.getElementById('cam2Name');

  function applyLayout(layout) {
    const c = Object.assign({}, DEFAULT_LAYOUT.content, layout.content);
    const s = Object.assign({}, DEFAULT_LAYOUT.secondary, layout.secondary);
    const c1 = Object.assign({}, DEFAULT_LAYOUT.cam1, layout.cam1);
    const c2 = Object.assign({}, DEFAULT_LAYOUT.cam2, layout.cam2);

    contentZone.style.left = c.centerX + 'px';
    contentZone.style.top = c.centerY + 'px';
    contentZone.style.transform = 'translate(-50%, -50%) scale(' + c.scale + ')';
    contentInner.style.borderRadius = c.cornerRadius + 'px';
    if (c.bgEnabled) {
      const hex = c.bgColor.replace('#', '');
      const r = parseInt(hex.substring(0,2), 16);
      const g = parseInt(hex.substring(2,4), 16);
      const b = parseInt(hex.substring(4,6), 16);
      contentInner.style.background = 'rgba(' + r + ',' + g + ',' + b + ',' + c.bgOpacity + ')';
    } else {
      contentInner.style.background = 'transparent';
    }

    secondaryZone.style.left = s.centerX + 'px';
    secondaryZone.style.top = s.centerY + 'px';
    secondaryZone.style.transform = 'translate(-50%, -50%) scale(' + s.scale + ')';
    secondaryZone.style.display = s.enabled ? 'block' : 'none';
    secondaryInner.style.borderRadius = s.cornerRadius + 'px';
    secondaryInner.style.gap = s.gap + 'px';
    if (s.bgEnabled) {
      const hex = s.bgColor.replace('#', '');
      const r = parseInt(hex.substring(0,2), 16);
      const g = parseInt(hex.substring(2,4), 16);
      const b = parseInt(hex.substring(4,6), 16);
      secondaryInner.style.background = 'rgba(' + r + ',' + g + ',' + b + ',' + s.bgOpacity + ')';
    } else {
      secondaryInner.style.background = 'transparent';
    }

    cam1Box.style.left = c1.centerX + 'px';
    cam1Box.style.top = c1.centerY + 'px';
    cam1Box.style.width = c1.width + 'px';
    cam1Box.style.height = c1.height + 'px';
    cam1Box.style.borderRadius = c1.cornerRadius + 'px';
    cam1Box.style.border = c1.borderWidth + 'px solid ' + c1.borderColor;
    cam1Box.style.display = c1.enabled ? 'block' : 'none';
    cam1Name.style.display = c1.nameplateEnabled ? 'block' : 'none';
    cam1Name.textContent = c1.name;

    cam2Box.style.left = c2.centerX + 'px';
    cam2Box.style.top = c2.centerY + 'px';
    cam2Box.style.width = c2.width + 'px';
    cam2Box.style.height = c2.height + 'px';
    cam2Box.style.borderRadius = c2.cornerRadius + 'px';
    cam2Box.style.border = c2.borderWidth + 'px solid ' + c2.borderColor;
    cam2Box.style.display = c2.enabled ? 'block' : 'none';
    cam2Name.style.display = c2.nameplateEnabled ? 'block' : 'none';
    cam2Name.textContent = c2.name;
  }

  applyLayout({});
  db.ref('overlay/layout').on('value', (snap) => {
    applyLayout(snap.val() || {});
  });
</script>

</body>
</html>
