<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Webcam Source</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
  }

  #camWrap {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Shown until camera permission is granted */
  #permissionPrompt {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    background: rgba(10,12,20,0.9);
    text-align: center;
    padding: 20px;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  #permissionPrompt p { color: #ccc; font-size: 14px; max-width: 260px; margin: 0; }
  #permissionPrompt button {
    background: #f4c04a;
    color: #1a1300;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="camWrap">
  <video id="camVideo" autoplay playsinline muted></video>

  <div id="permissionPrompt">
    <p>Camera access needed. If nothing happens after clicking, right-click this source in OBS &rarr; Interact, then click again.</p>
    <button id="grantBtn">Enable camera</button>
    <p id="camError" style="color:#ff8080; font-size:11px; margin-top:6px;"></p>
  </div>
</div>

<script>
  const video = document.getElementById('camVideo');
  const permissionPrompt = document.getElementById('permissionPrompt');
  const grantBtn = document.getElementById('grantBtn');
  const errorEl = document.getElementById('camError');

  function showPermissionPrompt(err) {
    if (errorEl) errorEl.textContent = (err && (err.name + ': ' + err.message)) || String(err || '');
    permissionPrompt.style.display = 'flex';
  }

  async function startCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    video.srcObject = stream;
    permissionPrompt.style.display = 'none';
  }

  grantBtn.addEventListener('click', () => {
    startCamera().catch(showPermissionPrompt);
  });

  // Deliberately NOT auto-requesting on page load — OBS's embedded browser
  // silently denies permission requests made outside of Interact mode, and
  // that denial can get cached. Waiting for a real button click avoids that.
</script>

</body>
</html>
