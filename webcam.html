<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Webcam Source</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
  }

  #camWrap {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 18px;
    display: block;
  }

  #namePlate {
    position: absolute;
    left: 14px;
    bottom: 14px;
    background: rgba(10, 12, 20, 0.82);
    border: 2px solid #f4c04a;
    border-radius: 8px;
    padding: 6px 14px;
    color: #fff;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }

  /* Camera picker — small, tucked in the corner, only really used via OBS Interact mode */
  #deviceBar {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 5;
  }
  #deviceSelect {
    background: rgba(0,0,0,0.7);
    color: #fff;
    border: 1px solid #f4c04a;
    border-radius: 6px;
    font-size: 12px;
    padding: 4px 6px;
    max-width: 160px;
  }

  /* Shown until camera permission is granted */
  #permissionPrompt {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    background: rgba(10,12,20,0.9);
    border-radius: 18px;
    text-align: center;
    padding: 20px;
  }
  #permissionPrompt p { color: #ccc; font-size: 14px; max-width: 260px; margin: 0; }
  #permissionPrompt button {
    background: #f4c04a;
    color: #1a1300;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="camWrap">
  <video id="camVideo" autoplay playsinline muted></video>
  <div id="namePlate"></div>

  <div id="deviceBar">
    <select id="deviceSelect"><option>Loading cameras...</option></select>
  </div>

  <div id="permissionPrompt">
    <p>Camera access needed. If nothing happens after clicking, right-click this source in OBS &rarr; Interact, then click again.</p>
    <button id="grantBtn">Enable camera</button>
    <p id="camError" style="color:#ff8080; font-size:11px; margin-top:6px;"></p>
  </div>
</div>

<script>
  /* =========================================================
     Set the name shown on the plate here, or override per-copy
     via URL, e.g. webcam.html?name=Alex
     ========================================================= */
  const DEFAULT_NAME = "Host";
  /* ========================================================= */

  const params = new URLSearchParams(window.location.search);
  const displayName = params.get('name') || DEFAULT_NAME;
  document.getElementById('namePlate').textContent = displayName;

  const video = document.getElementById('camVideo');
  const deviceSelect = document.getElementById('deviceSelect');
  const permissionPrompt = document.getElementById('permissionPrompt');
  const grantBtn = document.getElementById('grantBtn');
  const errorEl = document.getElementById('camError');

  let currentStream = null;

  async function startCamera(deviceId) {
    if (currentStream) {
      currentStream.getTracks().forEach(t => t.stop());
    }
    const constraints = {
      video: deviceId ? { deviceId: { exact: deviceId } } : true,
      audio: false
    };
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    currentStream = stream;
    video.srcObject = stream;
    permissionPrompt.style.display = 'none';
    await populateDeviceList();
  }

  async function populateDeviceList() {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cams = devices.filter(d => d.kind === 'videoinput');
    deviceSelect.innerHTML = '';
    cams.forEach((cam, i) => {
      const opt = document.createElement('option');
      opt.value = cam.deviceId;
      opt.textContent = cam.label || ('Camera ' + (i + 1));
      deviceSelect.appendChild(opt);
    });
  }

  deviceSelect.addEventListener('change', () => {
    startCamera(deviceSelect.value).catch(showPermissionPrompt);
  });

  function showPermissionPrompt(err) {
    if (errorEl) errorEl.textContent = (err && (err.name + ': ' + err.message)) || String(err || '');
    permissionPrompt.style.display = 'flex';
  }

  grantBtn.addEventListener('click', () => {
    startCamera().catch(showPermissionPrompt);
  });

  // Deliberately NOT auto-requesting on page load — OBS's embedded browser
  // silently denies permission requests made outside of Interact mode, and
  // that denial can get cached. Waiting for a real button click avoids that.
</script>

</body>
</html>
